{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Your Slot | Olive Cafe</title>

    <link
        rel="stylesheet"
        href="{% static 'home/css/styles.css' %}"
    >

    <style>

        /* ================================
           BOOKING PAGE
        ================================= */

        .booking-page {
            min-height: 100vh;
            background: #f8f9f5;
            padding: 60px 20px;
        }

        .booking-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */

        .booking-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .booking-label {
            color: #718355;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .booking-header h1 {
            color: #263322;
            font-size: 42px;
            margin: 0 0 12px;
        }

        .booking-header p {
            color: #6b7167;
            font-size: 16px;
            margin: 0;
        }

        /* Card */

        .booking-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(50, 65, 40, 0.08);
            border: 1px solid #e8ece3;
        }

        /* Form */

        .booking-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #34402e;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #dfe5d9;
            border-radius: 10px;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 14px;
            color: #333;
            background: #fbfcfa;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input {
            height: 48px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #718355;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(113, 131, 85, 0.12);
        }

        /* Button */

        .booking-submit {
            grid-column: 1 / -1;
            margin-top: 5px;
            text-align: center;
        }

        .booking-submit button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 10px;
            background: #718355;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .booking-submit button:hover {
            background: #5f7046;
            transform: translateY(-1px);
        }

        /* Back Link */

        .back-home {
            text-align: center;
            margin-top: 22px;
        }

        .back-home a {
            color: #718355;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        /* Required */

        .required {
            color: #b45f5f;
        }

        .booking-error {
    background: #fff4f2;
    color: #a34f45;
    border: 1px solid #f0d2cd;
    border-radius: 10px;
    padding: 12px 15px;
    margin-bottom: 22px;
    font-size: 14px;
}

        /* Mobile */

        @media (max-width: 700px) {

            .booking-page {
                padding: 35px 15px;
            }

            .booking-header h1 {
                font-size: 32px;
            }

            .booking-card {
                padding: 25px 20px;
                border-radius: 14px;
            }

            .booking-form {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .form-group.full-width,
            .booking-submit {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>

    <main class="booking-page">

        <div class="booking-container">


            <!-- HEADER -->

            <div class="booking-header">

                <div class="booking-label">
                    OLIVE CAFE
                </div>

                <h1>
                    Book Your Slot
                </h1>

                <p>
                    Reserve your favourite spot and enjoy
                    a relaxing time at Olive Cafe.
                </p>

            </div>


            <!-- BOOKING CARD -->

            <div class="booking-card">

                <!-- {% if error %}
    <div class="booking-error">
        {{ error }}
    </div>
{% endif %} -->

                <form
                    method="POST"
                    class="booking-form"
                >

                    {% csrf_token %}


                    <!-- NAME -->

                    <div class="form-group">

                        <label for="name">
                            Name <span class="required">*</span>
                        </label>

                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            Email <span class="required">*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- PHONE -->

                    <div class="form-group">

                        <label for="phone">
                            Phone <span class="required">*</span>
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- GUESTS -->

                    <div class="form-group">

                        <label for="guests">
                            Number of Guests
                            <span class="required">*</span>
                        </label>

                        <input
                            type="number"
                            id="guests"
                            name="guests"
                            min="1"
                            max="20"
                            placeholder="e.g. 2"
                            required
                        >

                    </div>


                    <!-- DATE -->

                    <div class="form-group">

                        <label for="date">
                            Date <span class="required">*</span>
                        </label>

                       <input
    type="date"
    id="date"
    name="date"
    required
    min="{{ today }}"
>

                    </div>


                    <!-- TIME -->

                    <div class="form-group">

                        <label for="time">
                            Time <span class="required">*</span>
                        </label>

                        <input
                            type="time"
                            id="time"
                            name="time"
                            required
                        >

                    </div>


                    <!-- SPECIAL REQUEST -->

                    <div class="form-group full-width">

                        <label for="message">
                            Special Request
                        </label>

                        <textarea
                            id="message"
                            name="message"
                            rows="4"
                            placeholder="Any special request? (Optional)"
                        ></textarea>

                    </div>


                    <!-- SUBMIT -->

                    <div class="booking-submit">

                        <button type="submit">
                            Confirm Booking
                        </button>

                    </div>

                </form>


                <!-- BACK -->

                <div class="back-home">

                    <a href="{% url 'home' %}">
                        ← Back to Olive Cafe
                    </a>

                </div>

            </div>

        </div>

    </main>

</body>

</html>
